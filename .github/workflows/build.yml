name: Build web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Type-check and build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
        run: npm run build
      - name: Validate math generators
        run: npm test
      - name: Simulate student interactions
        run: npm run test:ui
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Check mobile/tablet/desktop quizzes
        run: npm run test:viewport
      - name: Validate installable offline app
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          npm run test:offline
      - name: Save browser QA evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mathgenius-browser-test-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
